name: Verify ARIO SCRIPTS build

on:
  pull_request:
    branches: [main]
  push:
    branches: ["redesign/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify production build
        run: npm run build
